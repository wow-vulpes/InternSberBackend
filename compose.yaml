services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-kkd}
      DB_USERNAME: ${DB_USERNAME:-kkd}
      DB_PASSWORD: ${DB_PASSWORD:-kkd_local_example}
      KKD_DEMO_ENABLED: ${COMPOSE_DEMO_ENABLED:-true}
      KKD_RUN_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "2000"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${DB_NAME:-kkd}
      POSTGRES_USER: ${DB_USERNAME:-kkd}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kkd_local_example}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
