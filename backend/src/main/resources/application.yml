spring:
  application:
    name: kkd-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kkd}
    username: ${DB_USERNAME:kkd}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public
    liquibase-schema: public
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

kkd:
  demo:
    enabled: ${KKD_DEMO_ENABLED:false}
  run:
    enabled: ${KKD_RUN_ENABLED:false}
